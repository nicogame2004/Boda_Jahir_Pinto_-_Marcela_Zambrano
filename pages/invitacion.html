<section class="hero">

  <!-- Nombres de los novios -->
  <h1 class="hero__names">
    JAHIR <span>&</span> MARCELA
  </h1>

  <!-- Video (por ahora de prueba) -->
  <div class="hero__video">
    <video
      class="hero__videoEl"
      src="assets/video/prueba.mp4"
      controls
      playsinline
      preload="metadata"
    >
      Tu navegador no soporta video.
    </video>
  </div>

  <!-- Fecha -->
  <h2 class="hero__date" id="weddingDateText"></h2>

  <!-- Contador -->
  <div class="countdown" aria-label="Cuenta regresiva al matrimonio">
    <div class="countdown__box">
      <span class="countdown__num" id="cdDays">--</span>
      <span class="countdown__label">Days</span>
    </div>

    <div class="countdown__box">
      <span class="countdown__num" id="cdHours">--</span>
      <span class="countdown__label">Hours</span>
    </div>

    <div class="countdown__box">
      <span class="countdown__num" id="cdMins">--</span>
      <span class="countdown__label">Minutes</span>
    </div>

    <div class="countdown__box">
      <span class="countdown__num" id="cdSecs">--</span>
      <span class="countdown__label">Seconds</span>
    </div>
  </div>

</section>
